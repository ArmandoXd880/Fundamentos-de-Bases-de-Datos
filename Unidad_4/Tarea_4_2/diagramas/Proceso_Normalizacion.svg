<text x="1255" y="372.48" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="middle">separar P y E</text>
<polyline points="930,570 710,570" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="722.0,576.0 710.0,570.0 722.0,564.0" fill="none" stroke="#17365d" stroke-width="2"/>
