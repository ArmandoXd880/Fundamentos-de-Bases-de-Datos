<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1030" viewBox="0 0 1640 1030">
<rect width="100%" height="100%" fill="white"/>
<text x="820.0" y="51.6" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#17232e" font-weight="bold" font-style="normal" text-anchor="middle">Normalización aplicada a la hoja de préstamo</text>
<rect x="60" y="100" width="650" height="180" fill="#eaf2f8" stroke="#17365d" stroke-width="2"/>
<text x="78" y="134.24" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#17232e" font-weight="bold" font-style="normal" text-anchor="start">Estado no normalizado</text>
<text x="78" y="172.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Una hoja contiene teléfonos {t} y piezas {…}.</text>
<text x="78" y="202.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Mezcla usuario, préstamo, inventario y tipo.</text>
<text x="78" y="232.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">No es el esquema físico de la Unidad 3.</text>
<rect x="930" y="100" width="650" height="180" fill="#eaf2f8" stroke="#17365d" stroke-width="2"/>
<text x="948" y="134.24" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#17232e" font-weight="bold" font-style="normal" text-anchor="start">Primera forma normal</text>
<text x="948" y="172.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">R1 contiene una fila por renglón de préstamo.</text>
<text x="948" y="202.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Los teléfonos se guardan en relación aparte.</text>
<text x="948" y="232.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Claves de R1: PN, PE y PC.</text>
<rect x="930" y="460" width="650" height="220" fill="#eaf2f8" stroke="#17365d" stroke-width="2"/>
<text x="948" y="494.24" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#17232e" font-weight="bold" font-style="normal" text-anchor="start">Segunda forma normal</text>
<text x="948" y="532.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Cabecera2(P, U, S, FS, FL).</text>
<text x="948" y="562.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Inventario2(E, C, T, NT, D).</text>
<text x="948" y="592.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Detalle2(P, N, E, CS).</text>
<text x="948" y="622.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Se eliminan las dependencias parciales.</text>
<rect x="60" y="460" width="650" height="220" fill="#eaf2f8" stroke="#17365d" stroke-width="2"/>
<text x="78" y="494.24" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#17232e" font-weight="bold" font-style="normal" text-anchor="start">Tercera forma normal y FNBC</text>
<text x="78" y="532.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Usuario(U, S) y Prestamo(P, U, FS, FL).</text>
<text x="78" y="562.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Ejemplar(E, C, T) y TipoMaterial(T, NT, D).</text>
<text x="78" y="592.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Detalle2 se conserva; teléfonos siguen aparte.</text>
<text x="78" y="622.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Se eliminan las dependencias transitivas.</text>
