<text x="820" y="548.48" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="middle">separar U y T</text>
<text x="70" y="804.32" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">P préstamo; N renglón; U solicitante; S nombres; FS salida; FL límite; E ejemplar;</text>
<text x="70" y="844.32" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">C código de inventario; T tipo; NT nombre del tipo; D deporte; CS condición de salida.</text>
<text x="70" y="924.32" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17232e" font-weight="bold" font-style="normal" text-anchor="start">El SQL final completa esta proyección con perfiles, incidencias y los atributos de la Unidad 3.</text>
