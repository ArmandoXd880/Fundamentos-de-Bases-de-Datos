<text x="553" y="487.24" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#17232e" font-weight="bold" font-style="normal" text-anchor="start">1</text>
<text x="490" y="908.24" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#17232e" font-weight="bold" font-style="normal" text-anchor="start">0..*</text>
<text x="380" y="689.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">incidencias</text>
<text x="650" y="796.16" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#17232e" font-weight="bold" font-style="normal" text-anchor="start">Identificación de DetallePrestamo</text>
<text x="650" y="837.24" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">{id: prestamo.idPrestamo + numeroRenglon}</text>
<text x="650" y="892.32" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">{Por ejemplar: a lo sumo un detalle sin devolución}</text>
<text x="650" y="944.32" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">No se crea una clase Asignacion adicional.</text>
<text x="45" y="1028.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">EstadoOperativo = {apto, mantenimiento, baja}. EstadoIncidencia = {abierta, resuelta}.</text>
<text x="45" y="1069.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Rombo negro: composición. Rombo blanco: agregación compartida. Prestamo es la misma clase de la hoja 1.</text>
</svg>