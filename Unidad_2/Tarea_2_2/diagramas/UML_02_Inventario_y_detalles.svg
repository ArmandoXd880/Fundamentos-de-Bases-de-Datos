<polygon points="1410.0,236.0 1401.0,256.0 1410.0,276.0 1419.0,256.0" fill="white" stroke="#17365d" stroke-width="2"/>
<text x="1430" y="271.24" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#17232e" font-weight="bold" font-style="normal" text-anchor="start">1</text>
<text x="1430" y="366.24" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#17232e" font-weight="bold" font-style="normal" text-anchor="start">0..*</text>
