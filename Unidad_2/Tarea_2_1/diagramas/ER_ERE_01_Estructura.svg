<text x="55" y="958.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Lectura: el par junto a una entidad indica sus participaciones mínima y máxima en esa relación.</text>
<text x="55" y="991.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Doble rectángulo: entidad débil. Doble rombo: identificación. La línea doble hacia o indica totalidad.</text>
<text x="55" y="1022.4" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17232e" font-weight="normal" font-style="normal" text-anchor="start">Los atributos completos se detallan en las hojas 2 y 3. N significa varios; 0 indica participación opcional.</text>
