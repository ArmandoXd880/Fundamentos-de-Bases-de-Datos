<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1050" viewBox="0 0 1180 1050">
<rect width="100%" height="100%" fill="white"/>
<text x="590" y="51.45" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" fill="#17232e">Clasificación de las bases de datos</text>
<text x="590" y="93.9" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="normal" fill="#17232e">Los criterios se combinan y no son categorías excluyentes</text>
<polyline points="55,164 55,944" fill="none" stroke="#17365d" stroke-width="3"/>
<polyline points="55,204 90,204" fill="none" stroke="#17365d" stroke-width="2"/>
<rect x="90" y="137" width="340" height="135" rx="8" fill="#eaf3ed" stroke="#17365d" stroke-width="1.2"/>
<text x="106" y="170.95" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#17232e">Ubicación o distribución</text>
<polyline points="430,204 468,204" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,157 468,251" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,157 497,157" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,251 497,251" fill="none" stroke="#17365d" stroke-width="2"/>
<text x="510" y="171.95" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Centralizadas: un sitio administra los datos.</text>
<text x="510" y="200.92999999999998" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Distribuidas: datos coordinados entre varios sitios.</text>
<text x="510" y="229.90999999999997" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Pueden ser homogéneas o heterogéneas.</text>
<polyline points="55,365 90,365" fill="none" stroke="#17365d" stroke-width="2"/>
<rect x="90" y="298" width="340" height="135" rx="8" fill="#eaf3ed" stroke="#17365d" stroke-width="1.2"/>
<text x="106" y="331.95" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#17232e">Variabilidad de los datos</text>
<polyline points="430,365 468,365" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,318 468,412" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,318 497,318" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,412 497,412" fill="none" stroke="#17365d" stroke-width="2"/>
<text x="510" y="332.95" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Estáticas: conjunto estable para consulta histórica.</text>
<text x="510" y="361.93" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Dinámicas: admiten altas, cambios y eliminaciones.</text>
<text x="510" y="390.90999999999997" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Ejemplos: archivo cerrado y registro de ventas.</text>
<polyline points="55,526 90,526" fill="none" stroke="#17365d" stroke-width="2"/>
<rect x="90" y="459" width="340" height="135" rx="8" fill="#eaf3ed" stroke="#17365d" stroke-width="1.2"/>
<text x="106" y="492.95" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#17232e">Modelo de datos</text>
<polyline points="430,526 468,526" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,479 468,573" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,479 497,479" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,573 497,573" fill="none" stroke="#17365d" stroke-width="2"/>
<text x="510" y="493.95" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Jerárquicas, de red y relacionales.</text>
<text x="510" y="522.9300000000001" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Orientadas a objetos y NoSQL.</text>
<text x="510" y="551.9100000000001" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">NoSQL: documentos, clave valor, columnas y grafos.</text>
<polyline points="55,687 90,687" fill="none" stroke="#17365d" stroke-width="2"/>
<rect x="90" y="620" width="340" height="135" rx="8" fill="#eaf3ed" stroke="#17365d" stroke-width="1.2"/>
<text x="106" y="653.95" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#17232e">Usuarios concurrentes</text>
<polyline points="430,687 468,687" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,640 468,734" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,640 497,640" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,734 497,734" fill="none" stroke="#17365d" stroke-width="2"/>
<text x="510" y="654.95" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Monousuario: una persona a la vez.</text>
<text x="510" y="683.9300000000001" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Multiusuario: varios usuarios simultáneos.</text>
<text x="510" y="712.9100000000001" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Ejemplos: agenda local y sistema escolar.</text>
<polyline points="55,848 90,848" fill="none" stroke="#17365d" stroke-width="2"/>
<rect x="90" y="781" width="340" height="135" rx="8" fill="#eaf3ed" stroke="#17365d" stroke-width="1.2"/>
<text x="106" y="814.95" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#17232e">Finalidad principal</text>
<polyline points="430,848 468,848" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,801 468,895" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,801 497,801" fill="none" stroke="#17365d" stroke-width="2"/>
<polyline points="468,895 497,895" fill="none" stroke="#17365d" stroke-width="2"/>
<text x="510" y="815.95" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Transaccionales: operaciones diarias como ventas.</text>
<text x="510" y="844.9300000000001" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Analíticas: consultas y análisis de datos históricos.</text>
<text x="510" y="873.9100000000001" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Una organización puede utilizar ambas.</text>
<text x="590" y="1012.15" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#526271">Elaboración propia con base en los conceptos de clasificación y arquitectura de BD</text>
</svg>