<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1110" viewBox="0 0 1180 1110">
<rect width="100%" height="100%" fill="white"/>
<text x="590" y="49.45" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" fill="#17232e">Arquitectura funcional interna del SGBD</text>
<text x="590" y="89.95" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Esquema general de funciones  La implementación varía según el producto</text>
<rect x="80" y="123" width="650" height="87" rx="8" fill="#eaf3ed" stroke="#17365d" stroke-width="1.2"/>
<text x="96" y="157.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#17232e">Aplicación o usuario</text>
<text x="96" y="191.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#17232e">envía una consulta y recibe los resultados</text>
<polyline points="405,210 405,259" fill="none" stroke="#17365d" stroke-width="2"/>
<polygon points="405,259 400.6503446588877,249.99552897647322 409.3496553411123,249.99552897647322" fill="#17365d"/>
<rect x="80" y="259" width="650" height="90" rx="8" fill="#eaf2f8" stroke="#17365d" stroke-width="1.2"/>
<text x="96" y="293.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#17232e">Autorización y análisis</text>
<text x="96" y="327.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#17232e">Valida permisos, sintaxis y objetos referidos.</text>
<polyline points="405,349 405,398" fill="none" stroke="#17365d" stroke-width="2"/>
<polygon points="405,398 400.6503446588877,388.9955289764732 409.3496553411123,388.9955289764732" fill="#17365d"/>
<rect x="80" y="398" width="650" height="90" rx="8" fill="#eaf2f8" stroke="#17365d" stroke-width="1.2"/>
<text x="96" y="432.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#17232e">Optimizador</text>
<text x="96" y="466.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#17232e">Elige un plan de acceso según su costo estimado.</text>
<polyline points="405,488 405,537" fill="none" stroke="#17365d" stroke-width="2"/>
<polygon points="405,537 400.6503446588877,527.9955289764732 409.3496553411123,527.9955289764732" fill="#17365d"/>
<rect x="80" y="537" width="650" height="90" rx="8" fill="#eaf2f8" stroke="#17365d" stroke-width="1.2"/>
<text x="96" y="571.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#17232e">Ejecutor</text>
<text x="96" y="605.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#17232e">Realiza las operaciones del plan de consulta.</text>
<polyline points="405,627 405,676" fill="none" stroke="#17365d" stroke-width="2"/>
<polygon points="405,676 400.6503446588877,666.9955289764732 409.3496553411123,666.9955289764732" fill="#17365d"/>
<rect x="80" y="676" width="650" height="90" rx="8" fill="#eaf2f8" stroke="#17365d" stroke-width="1.2"/>
<text x="96" y="710.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#17232e">Gestor de almacenamiento y búferes</text>
<text x="96" y="744.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#17232e">Busca páginas en memoria o solicita lecturas a disco.</text>
<polyline points="405,766 405,847" fill="none" stroke="#17365d" stroke-width="2"/>
<polygon points="405,847 400.6503446588877,837.9955289764732 409.3496553411123,837.9955289764732" fill="#17365d"/>
<rect x="80" y="847" width="650" height="112" rx="8" fill="#eaf3ed" stroke="#17365d" stroke-width="1.2"/>
<text x="96" y="881.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#17232e">Almacenamiento persistente</text>
<text x="96" y="915.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#17232e">Archivos de datos e índices.</text>
<text x="96" y="943.5" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#17232e">Bitácora de recuperación o log.</text>
<rect x="805" y="257" width="310" height="160" rx="8" fill="#eaf3ed" stroke="#17365d" stroke-width="1.2"/>
<text x="821" y="290.95" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#17232e">Catálogo de datos</text>
<text x="821" y="323.5" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" fill="#17232e">Tablas, columnas,</text>
<text x="821" y="349.71999999999997" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" fill="#17232e">restricciones, permisos</text>
<text x="821" y="375.94" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" fill="#17232e">y estadísticas.</text>
<polyline points="805,332 756,332 756,304 730,304" fill="none" stroke="#17365d" stroke-width="2"/>
<polygon points="730,304 739.0044710235268,299.6503446588877 739.0044710235268,308.3496553411123" fill="#17365d"/>
<polyline points="805,372 772,372 772,443 730,443" fill="none" stroke="#17365d" stroke-width="2"/>
<polygon points="730,443 739.0044710235268,438.6503446588877 739.0044710235268,447.3496553411123" fill="#17365d"/>
<rect x="805" y="519" width="310" height="192" rx="8" fill="#eaf3ed" stroke="#17365d" stroke-width="1.2"/>
<text x="821" y="552.95" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#17232e">Transacciones</text>
<text x="821" y="585.5" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" fill="#17232e">Control de concurrencia.</text>
<text x="821" y="611.72" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" fill="#17232e">Confirmar o revertir.</text>
<text x="821" y="637.94" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" fill="#17232e">Recuperación ante fallos.</text>
<text x="821" y="664.16" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" fill="#17232e">Coordina los cambios.</text>
<polyline points="805,604 730,582" fill="none" stroke="#17365d" stroke-width="2"/>
<polygon points="730,582 739.8647240985625,580.3607262403006 737.4160980821251,588.7083149327011" fill="#17365d"/>
<polyline points="960,711 960,908 730,908" fill="none" stroke="#17365d" stroke-width="2"/>
<polygon points="730,908 739.0044710235268,903.6503446588877 739.0044710235268,912.3496553411123" fill="#17365d"/>
<polyline points="48,890 24,890 24,167 80,167" fill="none" stroke="#698779" stroke-width="2"/>
<polygon points="80,167 70.99552897647322,171.3496553411123 70.99552897647322,162.6503446588877" fill="#698779"/>
<text x="590" y="1021.95" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Lecturas: localización y devolución de datos.</text>
<text x="590" y="1050.93" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Escrituras: además intervienen la integridad, las transacciones y el registro de cambios.</text>
