<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1030" viewBox="0 0 1180 1030">
<rect width="100%" height="100%" fill="white"/>
<text x="590" y="48.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#17232e">Arquitectura de tres niveles ANSI SPARC</text>
<text x="590" y="89.95" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Varias vistas externas se apoyan en un esquema conceptual común</text>
<rect x="70" y="135" width="480" height="125" rx="8" fill="#eaf2f8" stroke="#17365d" stroke-width="1.2"/>
<text x="86" y="169.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#17232e">Nivel externo  Vista del alumno</text>
<text x="86" y="203.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#17232e">Consulta sus materias y calificaciones.</text>
<text x="86" y="231.5" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#17232e">No accede a los datos de otros alumnos.</text>
<rect x="630" y="135" width="480" height="125" rx="8" fill="#eaf2f8" stroke="#17365d" stroke-width="1.2"/>
<text x="646" y="169.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#17232e">Nivel externo  Vista del docente</text>
<text x="646" y="203.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#17232e">Consulta grupos y registra notas.</text>
<text x="646" y="231.5" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#17232e">Solo accede a las funciones autorizadas.</text>
<polyline points="310,260 310,320 590,320 590,382" fill="none" stroke="#17365d" stroke-width="2"/>
<polygon points="590,382 585.6503446588877,372.9955289764732 594.3496553411123,372.9955289764732" fill="#17365d"/>
<polyline points="870,260 870,320 590,320" fill="none" stroke="#17365d" stroke-width="2"/>
<rect x="400.2890625" y="334.0" width="379.421875" height="28" fill="white"/>
<text x="590" y="356.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#17232e">correspondencia externo conceptual</text>
<rect x="210" y="382" width="760" height="145" rx="8" fill="#eaf3ed" stroke="#17365d" stroke-width="1.2"/>
<text x="226" y="417.85" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#17232e">Nivel conceptual  Estructura lógica global</text>
<text x="226" y="453.3" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Alumnos, Materias, Inscripciones y Calificaciones.</text>
<text x="226" y="482.28000000000003" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Define relaciones, claves y restricciones de integridad.</text>
<text x="226" y="511.26" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">No especifica páginas, archivos ni posiciones en disco.</text>
<polyline points="590,527 590,635" fill="none" stroke="#17365d" stroke-width="2"/>
<polygon points="590,635 585.6503446588877,625.9955289764732 594.3496553411123,625.9955289764732" fill="#17365d"/>
<rect x="403.06640625" y="568.0" width="373.8671875" height="28" fill="white"/>
<text x="590" y="590.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#17232e">correspondencia conceptual interno</text>
<rect x="210" y="635" width="760" height="145" rx="8" fill="#eaf2f8" stroke="#17365d" stroke-width="1.2"/>
<text x="226" y="670.85" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#17232e">Nivel interno o físico  Almacenamiento</text>
<text x="226" y="706.3000000000001" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Archivos, páginas, índices y organización de registros.</text>
<text x="226" y="735.2800000000001" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Determina cómo se guardan y se localizan los datos.</text>
<text x="226" y="764.2600000000001" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#17232e">Ejemplo: índice por matrícula para acelerar una consulta.</text>
<polyline points="590,780 590,846" fill="none" stroke="#17365d" stroke-width="2"/>
<polygon points="590,846 585.6503446588877,836.9955289764732 594.3496553411123,836.9955289764732" fill="#17365d"/>
<rect x="315" y="846" width="550" height="85" rx="8" fill="#eaf3ed" stroke="#17365d" stroke-width="1.2"/>
<text x="331" y="880.9" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#17232e">Datos almacenados en los dispositivos</text>
<text x="590" y="978.05" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" fill="#17232e">Las solicitudes bajan hacia el almacenamiento y los resultados regresan a las vistas.</text>
</svg>